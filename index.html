<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чайная лавка</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- шапка -->
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="#">🍵 Чайная лавка</a>
      <nav>
        <ul class="menu">
          <li><a href="#catalog">Каталог</a></li>
          <li><a href="#cart">Корзина</a></li>
          <li><a href="#contacts">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- каталог -->
    <section class="catalog" id="catalog">
      <div class="container">
        <h1>Каталог товаров</h1>

        <div class="products" id="products"></div>
      </div>
    </section>

    <!-- корзина -->
    <section class="cart" id="cart">
      <div class="container">
        <h2>Корзина</h2>

        <p class="cart-empty" id="cart-empty">Корзина пуста</p>

        <ul class="cart-list" id="cart-list"></ul>

        <p class="cart-total">Итого: <span id="cart-total">0</span> ₽</p>

        <button class="order-button" id="order-button">Оформить заказ</button>

        <p class="order-message" id="order-message">Заказ создан!</p>
      </div>
    </section>
  </main>

  <!-- форма заказа -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">✕</button>
      <h2>Оформление заказа</h2>

      <form class="order-form" id="order-form">
        <label for="first-name">Имя</label>
        <input type="text" id="first-name" name="first-name" required>

        <label for="last-name">Фамилия</label>
        <input type="text" id="last-name" name="last-name" required>

        <label for="address">Адрес доставки</label>
        <input type="text" id="address" name="address" required>

        <label for="phone">Контактный телефон</label>
        <input type="tel" id="phone" name="phone" required>

        <button type="submit" class="order-button">Создать заказ</button>
      </form>
    </div>
  </div>

  <!-- подвал -->
  <footer class="footer" id="contacts">
    <div class="container">
      <p>Чайная лавка, 2026</p>
      <p>Телефон: +7 (000) 000-00-00</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
